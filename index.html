<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Bhagyasree Roy – Data & Systems Analyst" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Inter:wght@300;400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="css/styles.css" />
  <title>Bhagyasree Roy</title>
</head>
<body>

  <div id="menubar">
    <div class="menubar-left">
      <button class="mb-item mb-logo mb-logo-item" id="mb-logo-btn">{<span>BR</span>}</button>
      <div class="mb-dropdown" id="mb-logo-menu">
        <a href="mailto:bhagyasree.roy04@gmail.com"><i class="fas fa-envelope"></i> Email</a>
        <a href="https://github.com/Bhagyasreeroy" target="_blank" rel="noopener"><i class="fab fa-github"></i> GitHub</a>
        <a href="https://www.linkedin.com/in/bhagyasree-roy" target="_blank" rel="noopener"><i class="fab fa-linkedin"></i> LinkedIn</a>
        <div class="mb-divider"></div>
        <a href="https://drive.google.com/file/d/1Xfo4oftgtdMWwUIv-gEwff8ZF4HeTSxo/view?usp=sharing" target="_blank" rel="noopener"><i class="fas fa-download"></i> Resume</a>
      </div>

      <button class="mb-item" data-app="experience">File</button>
      <button class="mb-item" data-app="skills">Edit</button>
      <button class="mb-item" data-app="education">View</button>

      <button class="mb-item" id="mb-window-btn">Window</button>
      <div class="mb-dropdown" id="mb-window-menu"></div>

      <button class="mb-item" data-app="contact">Help</button>
    </div>
    <div class="menubar-right">
      <button class="mb-icon-btn" id="theme-toggle" aria-label="Toggle theme"><i class="fas fa-moon"></i></button>
      <button class="mb-icon-btn" id="search-btn" aria-label="Search"><i class="fas fa-search"></i></button>
      <span class="mb-clock" id="mb-clock"></span>
    </div>
  </div>

  <div id="desktop">
    <div class="desktop-icons">
      <button class="desktop-icon" data-app="home"><span class="icon-glyph"><i class="fas fa-house"></i></span><span class="icon-label">Home</span></button>
      <button class="desktop-icon" data-app="projects"><span class="icon-glyph"><i class="fas fa-diagram-project"></i></span><span class="icon-label">Projects</span></button>
      <button class="desktop-icon" data-app="contact"><span class="icon-glyph"><i class="fas fa-address-card"></i></span><span class="icon-label">Contact</span></button>
    </div>

    <div id="windows-layer"></div>
  </div>

  <div id="dock-wrap">
    <div id="dock">
      <div class="dock-item" data-app="home" title="Home"><i class="fas fa-house"></i><span class="dock-tip">Home</span><span class="dock-dot"></span></div>
      <div class="dock-item" data-app="experience" title="Experience"><i class="fas fa-briefcase"></i><span class="dock-tip">Experience</span><span class="dock-dot"></span></div>
      <div class="dock-item" data-app="projects" title="Projects"><i class="fas fa-diagram-project"></i><span class="dock-tip">Projects</span><span class="dock-dot"></span></div>
      <div class="dock-item" data-app="skills" title="Skills"><i class="fas fa-layer-group"></i><span class="dock-tip">Skills</span><span class="dock-dot"></span></div>
      <div class="dock-item" data-app="education" title="Education"><i class="fas fa-graduation-cap"></i><span class="dock-tip">Education</span><span class="dock-dot"></span></div>
      <div class="dock-item" data-app="certifications" title="Certifications"><i class="fas fa-certificate"></i><span class="dock-tip">Certifications</span><span class="dock-dot"></span></div>
      <div class="dock-sep"></div>
      <div class="dock-item" data-app="terminal" title="Terminal"><i class="fas fa-terminal"></i><span class="dock-tip">Terminal</span><span class="dock-dot"></span></div>
      <div class="dock-item" data-app="contact" title="Contact"><i class="fas fa-address-card"></i><span class="dock-tip">Contact</span><span class="dock-dot"></span></div>
    </div>
  </div>

  <!-- Search palette -->
  <div id="search-overlay">
    <div id="search-backdrop"></div>
    <div class="search-box">
      <input class="search-input" id="search-input" type="text" placeholder="Search apps, projects, skills…" />
      <div class="search-results" id="search-results"></div>
    </div>
  </div>

  <!-- Certification lightbox -->
  <div class="cert-modal" id="cert-modal" role="dialog" aria-modal="true">
    <div class="cert-modal-backdrop" id="modal-backdrop"></div>
    <div class="cert-modal-box">
      <button class="cert-modal-nav cert-modal-prev" id="modal-prev" aria-label="Previous"><i class="fas fa-chevron-left"></i></button>
      <div class="cert-modal-content">
        <img id="modal-img" src="" alt="" />
        <div class="cert-modal-info">
          <div class="cert-modal-title" id="modal-title"></div>
          <div class="cert-modal-meta" id="modal-meta"></div>
        </div>
      </div>
      <button class="cert-modal-nav cert-modal-next" id="modal-next" aria-label="Next"><i class="fas fa-chevron-right"></i></button>
      <button class="cert-modal-close" id="modal-close" aria-label="Close"><i class="fas fa-times"></i></button>
    </div>
  </div>

  <script src="js/data.js" defer></script>
  <script src="js/terminal.js" defer></script>
  <script src="js/windows.js" defer></script>
  <script src="js/apps.js" defer></script>
  <script src="js/search.js" defer></script>
  <script src="js/main.js" defer></script>
</body>
</html>
